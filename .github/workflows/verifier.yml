# Vérifie que les pages et assets/ ont bien été régénérés après une modification de src/,
# et que les règles de sécurité Firestore passent leurs tests sur l'émulateur.
name: Vérifier le build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Les fichiers générés sont-ils à jour ?
        run: node outils/build.mjs --verifier

  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Les règles Firestore refusent ce qu'elles doivent refuser
        working-directory: outils/tests-regles
        run: |
          npm ci --no-audit --no-fund
          npx --yes firebase-tools@15.0.0 emulators:exec --only firestore,auth --project demo-faelorenn "node --test --test-concurrency=1"
